name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.7.73"   # <-- ახალ ვერსიაზე მხოლოდ ეს ხაზი შეცვალე (zip-ის სახელი: televizia_android_app_v<VERSION>.zip)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o -q televizia_android_app_v${VERSION}.zip -d .
          ls -la TelevizaApp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: TelevizaApp
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp TelevizaApp/app/build/outputs/apk/debug/app-debug.apk "televizia-v${VERSION}.apk"
          gh release create "v${VERSION}-build${GITHUB_RUN_NUMBER}" "televizia-v${VERSION}.apk" \
            --title "TELEVIZIA ${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Android APK ${VERSION}"
